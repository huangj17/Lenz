name: Publish verified Windows hotfix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-hotfix.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: windows-startup-hotfix-v0.1.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Require successful startup verification and CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/huangj17/Lenz/actions/runs/38878002864 --jq .conclusion)" = success
          test "$(gh api repos/huangj17/Lenz/actions/runs/38878964756 --jq .conclusion)" = success
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe-startup
          run-id: 38878002864
          github-token: ${{ github.token }}
          path: verified-hotfix
      - name: Verify installer and preserve other release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.1.2 -p SHA256SUMS.txt -D previous-release
          node --input-type=module <<'JS'
          import { readFile, writeFile } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          const name = 'Lenz_0.1.2_windows_x64_setup.exe';
          const expected = '6a2fadfc047e26fbdce731d541c4a5310b35bb362b75fb72c917a79fb43e16e7';
          const binary = await readFile(`verified-hotfix/${name}`);
          if (binary.length !== 3996615 || createHash('sha256').update(binary).digest('hex') !== expected) throw Error('Unexpected installer');
          const original = await readFile('previous-release/SHA256SUMS.txt', 'utf8');
          const lines = original.trim().split('\n');
          if (lines.filter(line => line.endsWith(`  ${name}`)).length !== 1) throw Error('Missing or duplicate EXE checksum');
          const updated = lines.map(line => line.endsWith(`  ${name}`) ? `${expected}  ${name}` : line).join('\n') + '\n';
          await writeFile('verified-hotfix/SHA256SUMS.txt', updated);
          JS
      - name: Publish the verified installer and installation notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload v0.1.2 verified-hotfix/Lenz_0.1.2_windows_x64_setup.exe verified-hotfix/SHA256SUMS.txt --clobber
          gh release edit v0.1.2 --notes-file docs/releases/v0.1.2.md
      - name: Verify the public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.1.2 -p Lenz_0.1.2_windows_x64_setup.exe -p SHA256SUMS.txt -D public-download
          cmp verified-hotfix/Lenz_0.1.2_windows_x64_setup.exe public-download/Lenz_0.1.2_windows_x64_setup.exe
          cmp verified-hotfix/SHA256SUMS.txt public-download/SHA256SUMS.txt
