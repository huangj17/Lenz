name: Publish built installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag matching the build
        type: string
        required: true
      run_id:
        description: Release installers run with successful CI and platform builds
        type: string
        required: true
      overwrite:
        description: Replace installers of an already published release
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify tag and successful platform builds
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/verify-version.mjs --tag "$RELEASE_TAG"
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          tag_sha=$(git rev-parse "$RELEASE_TAG^{commit}")
          run_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" --jq .head_sha)
          test "$tag_sha" = "$run_sha"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID/jobs" > build-jobs.json
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const { jobs } = JSON.parse(readFileSync('build-jobs.json', 'utf8'));
          const builds = jobs.filter(j => j.name === 'windows' || j.name.startsWith('macos ('));
          if (builds.length !== 3 || builds.some(j => j.conclusion !== 'success')) throw new Error('All three platform builds must have succeeded.');
          // Runs from before release.yml called CI have no such jobs and cannot be published.
          const checks = jobs.filter(j => j.name.startsWith('ci / '));
          if (checks.length < 2 || checks.some(j => j.conclusion !== 'success')) throw new Error('CI (typecheck, tests, clippy) must have succeeded in the same run.');
          JS
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: release-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Publish existing installers and checksums
        shell: bash
        env:
          ALLOW_OVERWRITE: ${{ inputs.overwrite }}
        run: ./scripts/release/publish.sh downloaded-artifacts
