name: Release installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.verify.outputs.version }}
      tag: ${{ steps.verify.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: verify
        run: node scripts/release/verify-version.mjs

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            architecture: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Select Xcode 26 or newer
        run: python3 scripts/release/select-xcode.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build ad-hoc signed DMG
        run: pnpm tauri build --target "${{ matrix.target }}" --bundles dmg --config src-tauri/tauri.release.macos.conf.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.architecture }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release-windows-msvc
      - run: pnpm install --frozen-lockfile
      - name: Build test-signed MSIX (installation/OCR verification deferred)
        shell: powershell
        run: ./scripts/windows/Build-TestMsix.ps1 -CertificateValidityDays 365 -OutputDirectory src-tauri/target/msix/release
      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress
      - name: Build standalone EXE installer without MSIX certificate requirement
        shell: powershell
        run: ./scripts/windows/Build-Exe.ps1 -BinaryPath src-tauri/target/x86_64-pc-windows-msvc/release/lenz.exe -OutputDirectory src-tauri/target/release-assets
      - name: Bundle public certificate and installation helpers
        shell: powershell
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = 'src-tauri/target/msix/release'
          $assets = 'src-tauri/target/release-assets'
          New-Item $assets -ItemType Directory -Force | Out-Null
          Copy-Item "$output/*.msix" $assets
          Compress-Archive -Path "$output/*" -DestinationPath "$assets/Lenz_$env:RELEASE_VERSION`_windows_x64_test-signed.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: src-tauri/target/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: downloaded-artifacts
          merge-multiple: true
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/collect-assets.mjs --input downloaded-artifacts --output release
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Lenz $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
