<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lenz — Desktop Translator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    /* Warm, slightly off neutrals — not flat */
    --warm-white: #faf8f4;
    --warm-50: #f4f1ea;
    --warm-100: #ebe6db;
    --warm-200: #d8d1c2;
    --warm-300: #b8ad99;
    --warm-600: #6b6252;
    --warm-700: #443e33;
    --warm-900: #1c1a16;

    /* Cool sky-blue "lens" accent */
    --lens: #4ea3d9;
    --lens-soft: #bfe0f2;
    --lens-dark: #2d7fb3;

    /* Secondary — warm amber for source-language chip */
    --amber: #d98b3d;
    --sage: #7fa37a;

    --sf: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display',
          'Segoe UI', 'Noto Sans SC', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  }

  html, body { margin:0; padding:0; font-family: var(--sf); color: var(--warm-900); background:#eee9e0; }

  /* Lenz-shared primitives used inside artboards. Prefix ln- to avoid collisions. */

  .ln-win {
    border-radius: 12px;
    overflow: hidden;
    box-shadow:
      0 24px 48px -12px rgba(30,24,14,.18),
      0 2px 6px rgba(30,24,14,.08),
      0 0 0 0.5px rgba(30,24,14,.18);
    font-family: var(--sf);
    -webkit-font-smoothing: antialiased;
  }

  /* macOS traffic lights */
  .ln-traffic { display:flex; gap:8px; align-items:center; padding: 12px 14px; }
  .ln-traffic i { width:12px; height:12px; border-radius:50%; display:block; }
  .ln-traffic i:nth-child(1){ background:#ff5f57; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
  .ln-traffic i:nth-child(2){ background:#febc2e; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }
  .ln-traffic i:nth-child(3){ background:#28c840; box-shadow: inset 0 0 0 .5px rgba(0,0,0,.12); }

  /* vibrancy sidebar look */
  .ln-vibrancy-light {
    background:
      radial-gradient(110% 80% at 0% 0%, rgba(78,163,217,.12), transparent 60%),
      radial-gradient(120% 100% at 100% 100%, rgba(217,139,61,.08), transparent 60%),
      rgba(244,241,234,.82);
    backdrop-filter: saturate(1.3) blur(40px);
  }
  .ln-vibrancy-dark {
    background:
      radial-gradient(110% 80% at 0% 0%, rgba(78,163,217,.22), transparent 60%),
      radial-gradient(120% 100% at 100% 100%, rgba(217,139,61,.12), transparent 60%),
      rgba(26,24,20,.78);
    backdrop-filter: saturate(1.2) blur(40px);
  }

  /* Lens mark — the Lenz logo */
  .ln-mark {
    width: var(--s, 28px); height: var(--s, 28px);
    border-radius: 50%;
    background:
      radial-gradient(circle at 30% 30%, rgba(255,255,255,.85), rgba(255,255,255,0) 38%),
      radial-gradient(circle at 50% 50%, var(--lens-soft), var(--lens) 55%, var(--lens-dark) 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.25),
      inset 0 -3px 6px rgba(0,0,0,.15),
      0 1px 2px rgba(0,0,0,.12);
    position: relative;
  }
  .ln-mark::after {
    content:''; position:absolute; inset: 22%;
    border-radius:50%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0) 50%, rgba(0,0,0,.15) 72%, rgba(0,0,0,0) 78%);
  }

  /* Row / cell primitives */
  .ln-row { display:flex; align-items:center; gap:12px; }
  .ln-kbd {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    padding: 2px 6px; border-radius: 5px;
    background: rgba(30,24,14,.06);
    color: var(--warm-700);
    box-shadow: inset 0 -1px 0 rgba(30,24,14,.06), 0 0.5px 0 rgba(255,255,255,.6);
    letter-spacing: .02em;
    line-height: 1.3;
    display:inline-flex; align-items:center; gap:2px;
  }
  .ln-kbd.dark {
    background: rgba(255,255,255,.08);
    color: #e8e3d7;
    box-shadow: inset 0 -1px 0 rgba(0,0,0,.3), 0 0.5px 0 rgba(255,255,255,.1);
  }

  /* Underline shimmer on "translating" state */
  @keyframes ln-shimmer { from { background-position: 200% 0 } to { background-position: -200% 0 } }
  .ln-shimmer {
    background: linear-gradient(90deg, rgba(78,163,217,0) 0%, rgba(78,163,217,.5) 50%, rgba(78,163,217,0) 100%);
    background-size: 200% 100%;
    animation: ln-shimmer 1.4s linear infinite;
  }

  /* Placeholder image bands */
  .ln-ph {
    background:
      repeating-linear-gradient(135deg,
        rgba(30,24,14,.04) 0 8px,
        rgba(30,24,14,.00) 8px 18px),
      var(--warm-100);
    color: var(--warm-600);
    font-family: var(--mono);
    font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    display:flex; align-items:center; justify-content:center;
  }

  /* Engine row hover */
  .ln-engrow:hover { background: rgba(78,163,217,.05) !important; }
  /* Editable source hover/focus */
  [contenteditable]:hover { outline: 0.5px dashed rgba(78,163,217,.5); outline-offset: 2px; border-radius: 2px; }
  [contenteditable]:focus { outline: 1px solid var(--lens); outline-offset: 2px; border-radius: 2px; }

  /* gridlines dotted */
  .ln-dotgrid {
    background-image: radial-gradient(rgba(30,24,14,.09) 1px, transparent 1px);
    background-size: 14px 14px;
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
