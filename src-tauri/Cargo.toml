[package]
name = "lenz"
version = "0.1.1"
description = "Lenz — 跨平台截图翻译桌面工具"
authors = ["Lenz contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lenz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# 预留:启用自带 Tesseract OCR 兜底(默认关闭,不引入第三方依赖)。
ocr-tesseract = []

[profile.release]
opt-level = "s"
strip = "debuginfo"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
# 划词翻译(快捷键模式)读取剪贴板选中文本(spec 05 §3)。
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
log = "0.4"
tauri-specta = { version = ">=2.0.0-rc, <3", features = ["typescript"] }
specta-typescript = "0.0.12"
specta = { version = ">=2.0.0-rc, <3", features = ["uuid", "serde_json"] }
async-trait = "0.1.89"
image = "0.25.10"
base64 = "0.22"
xcap = "0.9.6"
# 翻译引擎 HTTP 客户端(spec 04)。native-tls 在 macOS=Security.framework /
# Windows=SChannel,无需 OpenSSL,契合双平台目标;socks 启用 socks5 代理。
reqwest = { version = "0.12", features = ["json"] }
# 有道智云签名(spec 04 §6):SHA256 摘要。
sha2 = "0.10"
# 腾讯云 OCR 的 TC3-HMAC-SHA256 签名与 UTC 日期。
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["std"] }
semver = "1"
# 百度翻译签名(spec 04 §13):MD5 摘要。
md-5 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-ml = { version = "0.3.2", default-features = false, features = ["std", "MLCPUComputeDevice", "MLComputeDeviceProtocol"] }
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Foundation_Collections", "Globalization", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_Threading", "Win32_Globalization", "Win32_Storage_Packaging_Appx", "ApplicationModel"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
# 用于 OCR 单元测试:在内存位图上渲染高对比度文字后让 Vision 识别(无需屏幕权限)。
ab_glyph = "0.2.32"
imageproc = "0.27.0"
